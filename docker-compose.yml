services:
  bot-relay:
    build: .
    # Everything comes from .env (design §12.1, fixes E3): new config keys
    # take effect without touching this file.
    env_file: .env
    # Inside its own network namespace the container must bind all interfaces
    # for the port mapping below to work; the host side stays loopback-only,
    # so the service is still unreachable from the public network.
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /data/bot-relay.sqlite
    # Loopback-only publishing: the local cloudflared tunnels
    # https://relay.songyang.xyz back to 127.0.0.1:8080 on this host. Never
    # bind 0.0.0.0 here (decision D1).
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - relay-data:/data
    restart: unless-stopped

volumes:
  relay-data:
