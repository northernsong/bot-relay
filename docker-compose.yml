services:
  bot-relay:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_PATH: /data/bot-relay.sqlite
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      RELAY_SECRET: ${RELAY_SECRET:?set RELAY_SECRET in .env}
      MAX_HOPS: ${MAX_HOPS:-8}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW_SEC: ${RATE_LIMIT_WINDOW_SEC:-60}
      ALLOW_HTTP_WEBHOOKS: ${ALLOW_HTTP_WEBHOOKS:-false}
      ALLOW_PRIVATE_WEBHOOKS: ${ALLOW_PRIVATE_WEBHOOKS:-false}
    volumes:
      - relay-data:/data
    restart: unless-stopped

volumes:
  relay-data:
